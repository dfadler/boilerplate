packages:
  - "packages/*"
allowBuilds:
  esbuild: true

# Supply-chain hardening (pnpm 10.16+/11). Weakening any of these needs a
# comment saying why, same as an `overrides` entry (include the advisory ID
# and a "drop when fixed" note).
#
# Don't install a version published less than 7 days ago (minutes).
minimumReleaseAge: 10080
# Fail the install if a package's trust level drops vs. an earlier release
# (e.g. lost npm provenance / trusted publishing).
trustPolicy: no-downgrade
# Direct deps may use git/tarball sources; transitive deps may not.
blockExoticSubdeps: true

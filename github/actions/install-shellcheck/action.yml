name: Install shellcheck
description: >
  Downloads a pinned shellcheck release, verifies it against a recorded
  SHA256, and installs it to /usr/local/bin.

# Factored out so the pin lives in one place: reusable-ci.yml's `actionlint`
# job uses this so actionlint can lint the `run:` blocks embedded in
# workflow YAML, and a consuming repo can reuse the same pin instead of
# duplicating the download step, via:
#   uses: dfadler/boilerplate/github/actions/install-shellcheck@main
#
# koalaman/shellcheck publishes no checksums file, so SHELLCHECK_SHA256
# below was recorded by downloading this exact release once — that pins the
# artifact (a later silent replacement, or a MITM on a future run, fails
# loudly) but does not establish provenance the way a signed upstream
# manifest would. On a version bump, re-record with:
#   curl -fsSL <url> | shasum -a 256
# Ported from dfadler/agent-config's install-shellcheck composite action.

runs:
  using: composite
  steps:
    - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
      shell: bash
      env:
        SHELLCHECK_VERSION: v0.11.0
        SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
      run: |
        curl -fsSL -o /tmp/shellcheck.tar.xz \
          "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
        echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
        tar -xJf /tmp/shellcheck.tar.xz -C /tmp
        sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
        rm -rf /tmp/shellcheck.tar.xz "/tmp/shellcheck-${SHELLCHECK_VERSION}"
        shellcheck --version

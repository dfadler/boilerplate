name: Setup pnpm and Node.js
description: >
  Installs pnpm and the requested Node.js version, then runs a
  frozen-lockfile install — the same three-step sequence repeated by
  reusable-ci.yml's build, deadcode, security-audit, and format jobs.

# Referenced from reusable-ci.yml via an explicit
# `dfadler/boilerplate/github/actions/setup-pnpm-node@main` reference, not a
# local `./` path — a `./`-referenced local action only resolves once the
# calling job has already checked out a repo containing that path, and
# those jobs' own checkout step checks out the *caller's* repo, not this
# one, for every external consumer of the reusable workflow. See
# dfadler/boilerplate#20 for the regression a local-path reference caused
# there (it broke `build`, not opt-in, for every external caller).
#
# Deliberately does NOT do its own checkout: checkout stays the job's own
# first step so this action's `pnpm install` runs against the caller's
# actual repo contents.

inputs:
  node-version:
    description: "Node.js version to use"
    required: true

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

name: Setup pnpm and Node.js
description: >
  Installs pnpm and the requested Node.js version, then runs a
  frozen-lockfile install — the same three-step sequence repeated by
  reusable-ci.yml's build, deadcode, security-audit, and format jobs.

# Referenced from reusable-ci.yml via an explicit
# `dfadler/boilerplate/github/actions/setup-pnpm-node@<sha>` reference
# pinned to a commit SHA, not a local `./` path or a mutable `@main`
# branch ref:
#   - a `./`-referenced local action only resolves once the calling job
#     has already checked out a repo containing that path, and those
#     jobs' own checkout step checks out the *caller's* repo, not this
#     one, for every external consumer of the reusable workflow. See
#     dfadler/boilerplate#20 for the regression a local-path reference
#     caused there (it broke `build`, not opt-in, for every external
#     caller).
#   - `@main` would resolve for any caller, but is mutable: a later push
#     to main changes this action's behavior for every existing caller
#     without review (CWE-829, flagged by zizmor on dfadler/boilerplate#22).
#     Pinning to a specific reviewed SHA avoids that; bump the pin (and its
#     trailing `# owner/repo#PR` comment) deliberately when this action
#     changes, the same way install-shellcheck's own SHELLCHECK_SHA256 is
#     bumped on a version change.
#
# Deliberately does NOT do its own checkout: checkout stays the job's own
# first step so this action's `pnpm install` runs against the caller's
# actual repo contents.

inputs:
  node-version:
    description: "Node.js version to use"
    required: true

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

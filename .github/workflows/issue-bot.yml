name: issue-bot

# Files a standalone issue from a PR comment that mentions @issue-bot
# (review comment on a diff line, or a general PR conversation comment).
# No AI involved — deterministic mention match, dedup by thread-root backlink.
#
# https://github.com/dfadler/issue-bot

on:
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]

jobs:
  issue-bot:
    permissions:
      issues: write
      pull-requests: write
    uses: dfadler/issue-bot/.github/workflows/reusable.yml@778495b3d77158d2ed1f3c596f50bc2664f11386 # v1.3.0
    with:
      ref: 778495b3d77158d2ed1f3c596f50bc2664f11386 # v1.3.0

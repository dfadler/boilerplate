name: issue-bot

# Files a standalone issue from a PR comment that mentions @issue-bot
# (review comment on a diff line, or a general PR conversation comment).
# No AI involved — deterministic mention match, dedup by thread-root backlink.
#
# https://github.com/dfadler/issue-bot

on:
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]

# concurrency: none — each run is a single, independent, idempotent
# issue-file-or-dedup attempt for one comment event; two comments in flight
# at once are unrelated work, and cancelling a run partway through an issue
# creation is worse than letting two finish.

jobs:
  issue-bot:
    permissions:
      issues: write
      pull-requests: write
    uses: dfadler/issue-bot/.github/workflows/reusable.yml@473c2eb4abbfb2be1980251f93ac6c9b2e3997c1 # v1.5.0
    with:
      ref: 473c2eb4abbfb2be1980251f93ac6c9b2e3997c1 # v1.5.0

name: Reusable CI

# Meant to be called from another repo's own workflow, not just this one:
#   jobs:
#     ci:
#       uses: dfadler/boilerplate/.github/workflows/reusable-ci.yml@main
# Assumes a pnpm workspace with build/lint/typecheck/test scripts at the root
# (stub any that don't apply — same convention as this repo's own packages).
# This repo's own ci.yml calls it too, so it's exercised on every PR here.
#
# The `deadcode` job is opt-in (default off, so existing callers aren't
# broken by a script they don't have) — enable it once the consuming repo
# has its own `deadcode` script (e.g. `knip`):
#   jobs:
#     ci:
#       uses: dfadler/boilerplate/.github/workflows/reusable-ci.yml@main
#       with:
#         deadcode: true
#
# The `actionlint` job is opt-in (default off) — lints the consuming repo's
# own .github/workflows/** for syntax/expression errors and, via shellcheck,
# bugs in embedded `run:` scripts. Needs nothing beyond workflow files to
# lint (ported from dfadler/agent-config's actionlint.yml):
#   jobs:
#     ci:
#       uses: dfadler/boilerplate/.github/workflows/reusable-ci.yml@main
#       with:
#         actionlint: true
#
# The `security-audit` job is opt-in (default off) — fails on a new
# high/critical-severity advisory in the production dependency tree
# (`pnpm audit --prod --audit-level=high`). A finding with no available fix
# can be allowlisted in the consuming repo's own pnpm-workspace.yaml under
# `auditConfig.ignoreGhsas` (ported from dfadler/dfadler.com's
# security-audit.yml):
#   jobs:
#     ci:
#       uses: dfadler/boilerplate/.github/workflows/reusable-ci.yml@main
#       with:
#         security-audit: true
#
# The `format` job is opt-in (default off, same reasoning as `deadcode`) —
# enable it once the consuming repo has its own `format:check` script
# (e.g. `prettier --check .`):
#   jobs:
#     ci:
#       uses: dfadler/boilerplate/.github/workflows/reusable-ci.yml@main
#       with:
#         format: true
#
# The `codeql` job is opt-in (default off) — runs GitHub CodeQL static
# analysis (javascript-typescript) and uploads results to the consuming
# repo's code scanning tab (ported from dfadler/issue-bot's codeql.yml).
# Uploading SARIF needs `security-events: write`, which a called reusable
# workflow can't grant itself — the CALLER's job must request it explicitly:
#   jobs:
#     ci:
#       permissions:
#         contents: read
#         actions: read
#         security-events: write
#       uses: dfadler/boilerplate/.github/workflows/reusable-ci.yml@main
#       with:
#         codeql: true
# A `workflow_call` workflow has no `schedule:` trigger of its own — for a
# periodic scan beyond push/PR, add a `schedule:` trigger to the caller's own
# workflow file (it'll invoke this same job on that cadence too).
on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        type: string
        default: "22"
      deadcode:
        description: "Run `pnpm deadcode` (requires that script to exist)"
        type: boolean
        default: false
      actionlint:
        description: "Lint .github/workflows/** with actionlint + shellcheck"
        type: boolean
        default: false
      security-audit:
        description: "Run `pnpm audit --prod --audit-level=high`"
        type: boolean
        default: false
      format:
        description: "Run `pnpm format:check` (requires that script to exist)"
        type: boolean
        default: false
      codeql:
        description: "Run CodeQL (javascript-typescript) and upload to code scanning (caller must grant security-events: write)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: dfadler/boilerplate/github/actions/setup-pnpm-node@23b8697a19fcdfe61808e2c3e32a85e0092970fe # dfadler/boilerplate#20
        with:
          node-version: ${{ inputs.node-version }}

      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  deadcode:
    if: ${{ inputs.deadcode }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: dfadler/boilerplate/github/actions/setup-pnpm-node@23b8697a19fcdfe61808e2c3e32a85e0092970fe # dfadler/boilerplate#20
        with:
          node-version: ${{ inputs.node-version }}

      - run: pnpm deadcode

  actionlint:
    if: ${{ inputs.actionlint }}
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This job only reads the checked-out workflow files and never
          # needs authenticated git — don't leave the GITHUB_TOKEN in reach.
          persist-credentials: false

      # Verified before extraction: piping curl into tar would run the
      # unverified payload first and check it never.
      - name: Install actionlint ${{ env.ACTIONLINT_VERSION }}
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          rm -f /tmp/actionlint.tar.gz /tmp/actionlint
          actionlint --version

      - name: Install shellcheck
        uses: dfadler/boilerplate/github/actions/install-shellcheck@23b8697a19fcdfe61808e2c3e32a85e0092970fe # dfadler/boilerplate#20

      - name: Lint workflows (actionlint)
        run: actionlint

  security-audit:
    if: ${{ inputs.security-audit }}
    name: pnpm audit (prod, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This job runs PR-controlled code and never needs authenticated
          # git after checkout — don't leave the GITHUB_TOKEN in reach.
          persist-credentials: false

      - uses: dfadler/boilerplate/github/actions/setup-pnpm-node@23b8697a19fcdfe61808e2c3e32a85e0092970fe # dfadler/boilerplate#20
        with:
          node-version: ${{ inputs.node-version }}

      # Fails (non-zero exit) on any high/critical prod advisory not listed
      # in the consuming repo's pnpm-workspace.yaml `auditConfig.ignoreGhsas`.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  format:
    if: ${{ inputs.format }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: dfadler/boilerplate/github/actions/setup-pnpm-node@23b8697a19fcdfe61808e2c3e32a85e0092970fe # dfadler/boilerplate#20
        with:
          node-version: ${{ inputs.node-version }}

      - run: pnpm format:check

  codeql:
    if: ${{ inputs.codeql }}
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

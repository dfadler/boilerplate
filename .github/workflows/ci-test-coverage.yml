name: test-coverage

# concurrency: none — workflow_call only, never triggered directly; the
# calling workflow's own concurrency group covers cancellation for this run.
on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        type: string
        default: "22"
      patch-coverage-threshold:
        description: "Minimum % coverage required on changed lines"
        type: number
        default: 90

permissions:
  contents: read

jobs:
  run:
    name: Patch coverage (diff-cover)
    runs-on: ubuntu-latest
    env:
      # Pinned to an exact release; bump deliberately (doubles as the pip
      # cache key below).
      DIFF_COVER_VERSION: 10.5.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # diff-cover diffs the PR against its base branch, so it needs full
          # history for both — a shallow clone has no merge-base to diff from.
          fetch-depth: 0
          submodules: recursive
          # This job runs PR-controlled code (the test suite) and never
          # needs authenticated git after checkout — don't leave the
          # GITHUB_TOKEN in reach.
          persist-credentials: false

      - uses: dfadler/boilerplate/github/actions/setup-pnpm-node@23b8697a19fcdfe61808e2c3e32a85e0092970fe # dfadler/boilerplate#20
        with:
          node-version: ${{ inputs.node-version }}

      - run: pnpm test:coverage

      # Keep the full report even when the patch gate below fails, so a
      # failing PR can still be inspected.
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      # pipx installs into its own venv (not pip's), but the wheel download
      # still goes through pip's cache dir underneath — caching it keyed on
      # DIFF_COVER_VERSION skips the download on every PR run instead of
      # only within a single job.
      - name: Cache pip packages (diff-cover)
        if: github.event_name == 'pull_request'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: pip-diffcover-${{ runner.os }}-${{ env.DIFF_COVER_VERSION }}

      - name: Enforce patch coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          THRESHOLD: ${{ inputs.patch-coverage-threshold }}
        run: |
          # origin/$BASE_REF is already present: the checkout above fetched
          # all branches (fetch-depth: 0), and with persist-credentials:
          # false a re-fetch here couldn't authenticate anyway.
          # pipx is preinstalled on GitHub-hosted runners and sidesteps PEP
          # 668 (Ubuntu's system Python is externally managed).
          pipx install "diff-cover==${DIFF_COVER_VERSION}"
          diff-cover coverage/lcov.info \
            --compare-branch="origin/$BASE_REF" \
            --fail-under="$THRESHOLD" \
            --markdown-report=diff-cover.md

      - name: Publish patch-coverage summary
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        run: cat diff-cover.md >> "$GITHUB_STEP_SUMMARY" || true

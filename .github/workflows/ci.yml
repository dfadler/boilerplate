name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Only needed once a private submodule is attached (see docs/submodules.md):
          # ssh-key: ${{ secrets.SUBMODULE_DEPLOY_KEY }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
